<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Спорт</title>
  <meta name="theme-color" content="#0c0d2b">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Спорт">
  <style>
    /* Тёмный фон с самого первого кадра — без белой вспышки при запуске */
    html, body { background: #0c0d2b; color-scheme: dark; }
  </style>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-startup-image" href="splash/launch-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/launch-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/launch-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/launch-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/launch-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/launch-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/launch-640x1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
</head>
<body>
  <script src="data.js"></script>
  <div id="splash" aria-hidden="true">
    <div class="sp-hole"></div>
    <div class="sp-stage">
      <div class="sp-scene"><div class="sp-cube" id="spCube"></div></div>
    </div>
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="pearlG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff4d6"/><stop offset=".35" stop-color="#ffc9dd"/><stop offset=".7" stop-color="#c9b8ff"/><stop offset="1" stop-color="#8fb8ff"/>
        </linearGradient>
        <linearGradient id="pearlB" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffe0ef"/><stop offset=".5" stop-color="#b9c7ff"/><stop offset="1" stop-color="#4f7bff"/>
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff3b8"/><stop offset=".6" stop-color="#ffd1e6"/><stop offset="1" stop-color="#b8c6ff"/>
        </linearGradient>
        <linearGradient id="coinG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d9fff1"/><stop offset=".45" stop-color="#9ff0d2"/><stop offset="1" stop-color="#7aa8ff"/>
        </linearGradient>
        <linearGradient id="clubG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5b6cff"/><stop offset="1" stop-color="#2230b8"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  <script>
    // Заставка: комната с предметами → выпрямляется → предметы падают → из блоков собирается куб
    // Показывается при каждом запуске и при каждом возвращении в приложение
    (function () {
      var first = document.getElementById("splash");
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) { first.remove(); return; }
      var template = first.cloneNode(true);

      function play(s, wait) {
      wait = wait || 0;
      if (wait) { s.classList.add("sp-wait"); setTimeout(function () { s.classList.remove("sp-wait"); }, wait); }
      var root = document.documentElement;
      root.classList.add("cards-roll");   // карточки выкатываются только после заставки
      var v = document.getElementById("view");
      if (v) { v.classList.remove("enter", "forward"); void v.offsetWidth; v.classList.add("enter"); }

      var O = 'stroke="#1b2d8a" stroke-width="3" stroke-linejoin="round"';
      var objs = [
        // Клубный щит (по центру, объёмный, под наклоном)
        ["o1", '<svg viewBox="0 0 120 150"><path d="M20 22 L60 8 L100 22 L104 70 Q100 118 60 142 Q20 118 16 70 Z" transform="translate(9 5)" fill="#1b2d8a"/>' +
               '<path d="M20 22 L60 8 L100 22 L104 70 Q100 118 60 142 Q20 118 16 70 Z" fill="url(#pearlG)" ' + O + '/>' +
               '<path d="M30 30 L60 19 L90 30 L93 70 Q90 108 60 128 Q30 108 27 70 Z" fill="url(#clubG)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>' +
               '<path d="M50 82 L50 46 L70 46 L70 82 M40 82 L80 82 M40 82 L40 94 M80 82 L80 94" transform="translate(1.5 -5)" fill="none" stroke="#1b2d8a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>' +
               '<path d="M50 82 L50 46 L70 46 L70 82 M40 82 L80 82 M40 82 L40 94 M80 82 L80 94" transform="translate(0 -7)" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>' +
               '<circle cx="60" cy="112" r="10" fill="#ffffff" stroke="#1b2d8a" stroke-width="2"/>' +
               '<path d="M51 108 Q59 107 66 103 M52 117 Q61 116 68 111 M58 102 Q54 112 60 122" fill="none" stroke="#2230b8" stroke-width="2" stroke-linecap="round"/></svg>'],
        // Ключ
        ["o2", '<svg viewBox="0 0 50 100"><circle cx="25" cy="14" r="11" fill="none" stroke="#9fd0ff" stroke-width="5"/><circle cx="25" cy="14" r="11" fill="none" stroke="#1b2d8a" stroke-width="1.5"/><rect x="9" y="24" width="32" height="26" rx="6" fill="#2f4fe0" ' + O + '/><path d="M14 30 L14 44" stroke="#9fb4ff" stroke-width="3" stroke-linecap="round"/><path d="M19 50 L31 50 L31 92 L25 98 L19 92 L19 82 L14 82 L14 76 L19 76 L19 70 L12 70 L12 64 L19 64 Z" fill="url(#gold)" ' + O + '/><path d="M24 56 L24 88" stroke="#1b2d8a" stroke-width="2" stroke-dasharray="3 4"/></svg>'],
        // Монета биткоина
        ["o3", '<svg viewBox="0 0 64 64"><ellipse cx="34" cy="34" rx="26" ry="27" fill="#1b2d8a"/><circle cx="30" cy="31" r="27" fill="url(#coinG)" ' + O + '/><circle cx="30" cy="31" r="20" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/><text x="30" y="41" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="#1b2d8a">B</text><path d="M26 14 L26 20 M34 14 L34 20 M26 42 L26 48 M34 42 L34 48" stroke="#1b2d8a" stroke-width="3.5" stroke-linecap="round"/></svg>'],
        // Эфириум
        ["o4", '<svg viewBox="0 0 60 92"><path d="M30 3 L54 45 L30 58 L6 45 Z" fill="url(#pearlG)" ' + O + '/><path d="M30 3 L30 58 L6 45 Z" fill="#ffffff" opacity=".35"/><path d="M6 45 L30 32 L54 45" fill="none" stroke="#1b2d8a" stroke-width="2"/><path d="M30 3 L30 32" stroke="#1b2d8a" stroke-width="2"/><path d="M30 64 L54 51 L30 89 L6 51 Z" fill="url(#pearlB)" ' + O + '/><path d="M30 64 L30 89 L6 51 Z" fill="#ffffff" opacity=".3"/></svg>']
      ];
      var room = '<div class="room"><i class="rf"></i><i class="rw rw1"></i><i class="rw rw2"></i>';
      objs.forEach(function (o) { room += '<div class="obj ' + o[0] + '"><div class="obj-in">' + o[1] + "</div></div>"; });
      room += "</div>";

      // Куб 3×3×3 в цветах макета: синие и чёрные грани, мятные рёбра
      var B = 34, html = "";
      var BL = "b", BK = "k", MT = "m", LT = "l";
      function faceColor(x, y, z, f) {
        if (f === "tp" && y === 0) return (x === 1 && z === 0) ? MT : (x === 2 && z === 0) ? BL : BK;
        if (f === "ft" && z === 2) return (x === 0 && y === 0) ? LT : (x === 2 && y < 2) ? BK : (x === 1 && y === 2) ? BL : BL;
        if (f === "rt" && x === 2) return ((z === 0 && y === 1) || (z === 1 && y === 2)) ? BL : BK;
        return BK;
      }
      // Символы валют на синих гранях (перламутровый градиент)
      var icons = ["₿", "Ξ", "Ł", "Ð", "$", "€", "£", "¥"].map(function (c) { return '<b class="sym">' + c + "</b>"; });
      var iconIdx = 0;
      var faces = ["ft", "bk", "rt", "lt", "tp", "bt"];
      for (var y = 0; y < 3; y++) for (var z = 0; z < 3; z++) for (var x = 0; x < 3; x++) {
        var vars = "--x:" + (x - 1) * B + "px;--y:" + (y - 1) * B + "px;--z:" + (z - 1) * B + "px;" +
          "--d:" + (1.75 + (2 - y) * 0.3 + Math.random() * 0.22).toFixed(2) + "s";
        html += '<div class="blk" style="' + vars + '"><div class="b">';
        for (var f = 0; f < 6; f++) {
          var c = faceColor(x, y, z, faces[f]), ic = "";
          if (c === BL && (faces[f] === "ft" || faces[f] === "rt")) ic = icons[iconIdx++ % icons.length];
          if (faces[f] === "ft" && x === 2 && y === 0 && z === 2) ic = '<svg class="race" viewBox="0 0 90 110"><defs><clipPath id="rcClip"><path d="M12 10 Q45 2 78 10 L78 56 Q76 88 45 104 Q14 88 12 56 Z"/></clipPath></defs><g clip-path="url(#rcClip)"><rect width="90" height="110" fill="url(#pearlB)"/><rect width="30" height="20" fill="#1fa05a"/><rect x="30" width="30" height="20" fill="#fff"/><rect x="60" width="30" height="20" fill="#e0303a"/><path d="M41 37 L56 31 L48 87 L36 87 L41 51 L34 54 Z" fill="#0a0a14"/><path d="M43 40 L52 36.5" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6"/></g><path d="M12 10 Q45 2 78 10 L78 56 Q76 88 45 104 Q14 88 12 56 Z" fill="none" stroke="#0a0a14" stroke-width="6" stroke-linejoin="round"/><path d="M12 20 L78 20" stroke="#0a0a14" stroke-width="3"/></svg>';
          if (c === LT && faces[f] === "ft") ic = '<b class="sym crown">\u265B\uFE0E</b>';
          html += '<i class="f ' + faces[f] + " c-" + c + '">' + ic + "</i>";
        }
        html += "</div></div>";
      }
      s.querySelector(".sp-cube").innerHTML = room + html;

      var k = Math.min(innerWidth / 380, innerHeight / 520, 2.2);
      s.style.setProperty("--k", k.toFixed(3));
      s.style.setProperty("--hole", Math.ceil(Math.hypot(innerWidth, innerHeight) * 1.1) + "px");
      document.documentElement.classList.add("splashing", "sp-hold");
      setTimeout(function () { document.documentElement.classList.remove("sp-hold"); }, 4350 + wait);

      var done = function () {
        removeEventListener("keydown", done);
        if (!s.isConnected || s.classList.contains("out")) return;
        s.classList.add("out");
        root.classList.remove("splashing", "sp-hold");
        setTimeout(function () { s.remove(); }, 400);
        setTimeout(function () { root.classList.remove("cards-roll"); }, 2200);
      };
      setTimeout(done, 4950 + wait);
      s.addEventListener("click", done);
      addEventListener("keydown", done);
      }

      var lastPlay = 0;
      function start(s, wait) {
        lastPlay = Date.now();
        play(s, wait);
      }

      // Если страница загрузилась в фоне (например, обновление), заставку держим до момента, когда её увидят
      if (document.visibilityState === "hidden") {
        first.classList.add("sp-wait");
        document.addEventListener("visibilitychange", function onShow() {
          if (document.visibilityState !== "visible") return;
          document.removeEventListener("visibilitychange", onShow);
          first.classList.remove("sp-wait");
          start(first, 0);
        });
      } else {
        start(first, 0);
      }

      // Вернулись в приложение (свернули и открыли снова) — заставка заново, но только один раз
      var hiddenAt = 0;
      function replay() {
        if (Date.now() - lastPlay < 3000) return;          // защита от двойного запуска
        var old = document.getElementById("splash");
        if (old) old.remove();
        var s = template.cloneNode(true);
        document.body.insertBefore(s, document.body.firstChild);
        start(s, 750);
      }
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") hiddenAt = Date.now();
        else if (hiddenAt && Date.now() - hiddenAt >= 30000) { hiddenAt = 0; replay(); }
      });
    })();
  </script>
  <header id="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Назад" hidden>‹</button>
    <h1 id="title">Тренировки</h1>
  </header>

  <main id="view"></main>

  <nav id="tabbar">
    <a href="#/" data-tab="home"><span>🏋️</span>Тренировки</a>
    <a href="#/nutrition" data-tab="nutrition"><span>🍽️</span>Питание</a>
    <a href="#/settings" data-tab="settings"><span>⚙️</span>Настройки</a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
